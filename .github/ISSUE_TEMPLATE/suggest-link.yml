name: Suggest a Link
description: Suggest a useful tool, resource, or repository for Awesome Links.
title: "Link suggestion: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Know something worth adding to Awesome Links?
        Share a useful resource with the community.

  - type: textarea
    id: resource_name
    attributes:
      label: Resource Name
      description: What is the name of the tool, resource, or project? For multiple links, put one name on each line in the same order as the URLs.
      placeholder: e.g. Visual Studio Code
    validations:
      required: true

  - type: textarea
    id: resource_url
    attributes:
      label: Resource URL
      description: Provide a direct HTTPS link. For multiple links, put one URL on each line in the same order as the names.
      placeholder: https://example.com
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Which category best fits this resource? Leave blank if you are unsure; the bot will choose the closest match.
      options:
        - "AI"
        - "Developer"
        - "Developer Utilities"
        - "APIs & Backend"
        - "Maps"
        - "Testing & Prototyping"
        - "UI & Design"
        - "UI Components"
        - "Design Inspiration"
        - "Colors"
        - "Animation & Motion"
        - "Fonts & Typography"
        - "Design Tools"
        - "Learning & Documentation"
        - "Certificates"
        - "Repositories"
        - "Apps"
        - "Miscellaneous"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Why should it be included?
      description: Briefly explain what makes this resource useful. Leave blank and the bot will try to write a short description from the linked page.
      placeholder: What does it do, and why is it worth adding?
    validations:
      required: false